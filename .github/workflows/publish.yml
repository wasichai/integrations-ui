name: Publish

on:
  release:
    types: [published]

# one upload at a time: a second release waits instead of racing the first
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # the guard runs before the upload: a failed guard blocks it, so a release never half-publishes
  guards:
    name: Release guard (npm)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # los paquetes de GitHub Packages de wasichai piden un token read:packages: packages-token lo pide a Infisical por OIDC, sin secretos en el repo
      # antes de setup-node, que con cache: yarn ya corre yarn
      - uses: ./.github/actions/packages-token
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - name: Release guard (npm)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node tooling/check-release.mjs --pack --version "$VERSION"

  npm:
    name: npm packages
    needs: guards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # los paquetes de GitHub Packages de wasichai piden un token read:packages: packages-token lo pide a Infisical por OIDC, sin secretos en el repo
      # antes de setup-node, que con cache: yarn ya corre yarn
      - uses: ./.github/actions/packages-token
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: yarn
          registry-url: https://npm.pkg.github.com
          # the scope must equal the organization: github packages refuses any other
          scope: '@wasichai'
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - name: Publish every public @wasichai package
        env:
          # publishing to this repository's packages: the workflow's own token, packages: write
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the one the guard checked
          VERSION: ${{ needs.guards.outputs.version }}
        # skips versions already up, so re-running a failed upload finishes it
        run: node tooling/publish-packages.mjs "$VERSION"
